id: SHOP-105
type: new
title: Loyalty discount for returning customers
request: Registered customers who have placed at least one previous order get 5% off the order subtotal, rounded half up to the cent. The receipt must show "Loyalty 5% off". New customers (no orders yet) and guests get no loyalty discount.
check_type: functional
scope:
  paths: ["app/config.py", "app/pricing/**"]
criteria:
  - id: AC-1
    priority: MUST
    statement: A returning customer gets 5% off the subtotal with the label "Loyalty 5% off".
    examples:
      - { via: api.quote_order, input: { customer: returning-customer-01, subtotal: 40.00 }, expect: { discount: 2.00, discount_label: "Loyalty 5% off" } }
  - id: AC-2
    priority: MUST
    statement: The discount is rounded half up to the cent.
    examples:
      - { via: api.quote_order, input: { customer: returning-customer-01, subtotal: 10.10 }, expect: { discount: 0.51 } }   # 0.505
      - { via: api.quote_order, input: { customer: returning-customer-01, subtotal: 33.30 }, expect: { discount: 1.67 } }   # 1.665
  - id: AC-3
    priority: MUST
    statement: A new customer with no previous orders gets no loyalty discount.
    examples:
      - { via: api.quote_order, input: { customer: new-customer-01, subtotal: 40.00 }, expect: { discount: 0.00 } }
  - id: AC-4
    priority: MUST
    statement: A guest gets no loyalty discount.
    examples:
      - { via: api.quote_order, input: { customer: guest, subtotal: 40.00 }, expect: { discount: 0.00 } }
  - id: AC-5
    priority: MUST
    statement: The receipt shows the loyalty discount for a returning customer and none for a new customer.
    examples:
      - via: browser.checkout_and_read_receipt
        input: { customer: returning-customer-01, add: ["MUG-001", "TSHIRT-001"] }   # 32.00
        expect: { discount: 1.60, discount_label: "Loyalty 5% off" }
      - via: browser.checkout_and_read_receipt
        input: { customer: new-customer-01, add: ["MUG-001", "TSHIRT-001"] }         # 32.00
        expect: { discount: 0.00 }
open_questions: []
